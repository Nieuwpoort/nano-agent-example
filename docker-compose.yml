# ifenpay Agent - Stateless LLM Baseline
#
# Optional GPU for Ollama:
# - Uncomment runtime/nvidia env lines on `ollama` service

services:
  init:
    image: alpine:latest
    container_name: ifenpay-init
    volumes:
      - ./:/host
      - ./docker/init-env.sh:/init-env.sh:ro
    command: sh /init-env.sh

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    gpus: all
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
      - ./docker/ollama-entrypoint.sh:/entrypoint.sh:ro
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "1"
    environment:
      - LLM_USE_GPU=${LLM_USE_GPU}
      - NVIDIA_VISIBLE_DEVICES=all
      - OLLAMA_FLASH_ATTENTION=${OLLAMA_FLASH_ATTENTION}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS}
      - OLLAMA_CONTEXT_LENGTH=${OLLAMA_CONTEXT_LENGTH}
      - GIN_MODE=release

  ifenpay-agent:
    build:
      context: .
    image: ifenpay-agent
    container_name: ifenpay-agent
    ports:
      - "7860:7860"
    volumes:
      - ./src:/app/src
      - ./docker/agent-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      - AGENT_MODE=${AGENT_MODE}
      - LLM_MODEL=${LLM_MODEL}
      - LLM_HOST=http://ollama:11434
      - LLM_CONTEXT_LENGTH=${LLM_CONTEXT_LENGTH}
      - LLM_NUM_PARALLEL=${LLM_NUM_PARALLEL}
      - LLM_KEEP_ALIVE=${LLM_KEEP_ALIVE}
      - LLM_PRELOAD_MODEL=${LLM_PRELOAD_MODEL}
      - MCP_TOOLSET_BASE_URL=${MCP_TOOLSET_BASE_URL}
    depends_on:
      init:
        condition: service_completed_successfully
      ollama:
        condition: service_started
    restart: unless-stopped

volumes:
  ollama_data:
